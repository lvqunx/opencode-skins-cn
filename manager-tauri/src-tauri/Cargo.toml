[package]
name = "opencode-skins-manager"
version = "1.0.0"
edition = "2021"
description = "Native Tauri shell for the opencode-skins manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
